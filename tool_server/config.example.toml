port = 8102
display = ":5"
# "cua" uses trycua/cua's new cua-sandbox Localhost API.
# Use "legacy" to fall back to the previous PyAutoGUI/XDoTool backend.
computer_backend = "cua"

[log]
env = "dev"
format = "%(asctime)s %(levelname)7s %(request_id)s %(filename)s:%(lineno)s - %(name)s - %(message)s"

